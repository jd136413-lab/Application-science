name: novum
description: "Novum — les avancées scientifiques et technologiques du moment."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.18.3
  google_fonts: ^9.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  google_mlkit_translation: ^0.15.1
  # Notifications (Firebase Cloud Messaging + affichage sur le téléphone)
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.0.0

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# Phase 8 — icône et écran de démarrage (générés à chaque compilation)
# Images dans app/assets/icone/. Pour changer l'icône : remplace ces images
# en gardant exactement les mêmes noms de fichiers.
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false                                   # activé en phase 9 (iOS)
  image_path: assets/icone/icone.png
  adaptive_icon_background: "#F2F1F6"
  adaptive_icon_foreground: assets/icone/icone_avant.png
  adaptive_icon_foreground_inset: 0               # pas de marge en plus : la taille est réglée dans l'image
  adaptive_icon_monochrome: assets/icone/icone_mono.png   # icônes « thématiques » (Android 13+)
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icone/icone.png
    background_color: "#F2F1F6"
    theme_color: "#F2F1F6"

flutter_native_splash:
  color: "#F2F1F6"                             # fond clair
  image: assets/icone/demarrage.png
  color_dark: "#0F0F14"                        # fond sombre
  image_dark: assets/icone/demarrage_sombre.png
  android_12:                                  # Android 12 et plus : la case seule
    color: "#F2F1F6"
    image: assets/icone/demarrage_android12.png
    color_dark: "#0F0F14"
    image_dark: assets/icone/demarrage_android12_sombre.png
  ios: false
  web: true
