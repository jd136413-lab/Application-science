# Tester la nouvelle consigne de rédaction des fiches (03/11/2026) sans rien publier.
# Réécrit quelques fiches déjà publiées et enregistre un rapport « avant / après »
# dans agent/tests_redaction.md sur la branche testée. Coût : quelques centimes
# (plafond de sécurité réglable, 1 $ par défaut). Aucune écriture dans la base.
# Claude le lance en poussant une branche « redaction/… ».
name: Tester la rédaction

on:
  push:
    branches: ["redaction/**"]
  workflow_dispatch:
    inputs:
      modeles:
        description: "Modèles à comparer (haiku, sonnet)"
        default: "haiku"
      nb:
        description: "Nombre de fiches récentes"
        default: "8"

permissions:
  contents: write

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installer les dépendances
        run: pip install -r agent/requirements.txt
      - name: Réécrire des fiches (rapport seulement)
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODELES: ${{ inputs.modeles || vars.TEST_MODELES || 'haiku' }}
          NB: ${{ inputs.nb || '12' }}
          # Test 6 : fiches JAMAIS vues pendant la mise au point (plus anciennes)
          TITRES: ""
          DECALAGE: "14"
          PLAFOND: "1.0"
        run: python tester_redaction.py
      - name: Enregistrer le rapport sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f agent/tests_redaction.md ] && git add agent/tests_redaction.md
          git commit -m "Rapport de test de la rédaction [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
