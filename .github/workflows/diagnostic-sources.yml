# Diagnostic gratuit (20/11/2026) : sources injoignables depuis GitHub, et adresses de remplacement.
name: Diagnostic sources

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (compatible; NovaSTEM/1.0; +https://jd136413-lab.github.io/Application-science/)'
          for u in \
            https://newscenter.lbl.gov/feed/ https://newscenter.lbl.gov/category/news-releases/feed/ \
            https://www.anl.gov/rss.xml https://www.anl.gov/news/rss.xml https://www.anl.gov/rss/research-news/feed.xml \
            https://www.esa.int/rssfeed/Our_Activities/Space_Engineering_Technology https://www.esa.int/rssfeed/Enabling_Support/Space_Engineering_Technology https://www.esa.int/rssfeed/Enabling_Support \
            https://www.usinenouvelle.com/rss/ https://www.usinenouvelle.com/rss/all/ \
            https://www.usine-digitale.fr/rss https://www.usine-digitale.fr/rss/all/ ; do
            printf "%-75s " "$u"; curl -s -L -o /tmp/f -w "%{http_code} %{content_type} " -A "$UA" --max-time 20 "$u"; grep -c "<item\|<entry" /tmp/f || true
          done
