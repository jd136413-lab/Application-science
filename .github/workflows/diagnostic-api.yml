# Diagnostic (20/11/2026) : quels réglages l'API accepte pour le contrôle des doublons « À venir ». < 0,001 $.
name: Diagnostic API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q anthropic
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'P'
          from anthropic import Anthropic
          c = Anthropic()
          schema = {"type": "object", "properties": {"ok": {"type": "boolean"}}, "required": ["ok"], "additionalProperties": False}
          for nom, extra in [("between_tools", {"thinking": {"type": "between_tools"}})]:
              oc = {"format": {"type": "json_schema", "schema": schema}}
              if "__effort" in extra:
                  oc["effort"] = extra.pop("__effort")
              try:
                  r = c.messages.create(model="claude-sonnet-5-5", max_tokens=1500, system="Réponds en JSON.",
                                        messages=[{"role": "user", "content": "Dis ok."}], output_config=oc, **extra)
                  print(f"{nom} : OK", r.usage.input_tokens, r.usage.output_tokens)
              except Exception as ex:
                  print(f"{nom} : ERREUR {ex}")
          P
