# Traite les propositions des lecteurs (onglet Soumettre : sujets, résumés, événements À venir).
# SÉPARÉ de l'agent de collecte (agent.yml n'est pas modifié). Lancé à la main pour l'instant :
# Actions → « Soumissions » → Run workflow. Coût : ≈ 0,02 à 0,05 $ par proposition.
name: Soumissions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soumissions
  cancel-in-progress: false

jobs:
  traiter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Traiter les propositions
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python soumissions.py
