# Télécharge des images LIBRES DE DROITS dans design/images/ (pour les maquettes).
# Onglet « Actions » → « Télécharger des images » → Run workflow.
# Format : nom1.jpg=https://adresse1 nom2.png=https://adresse2
name: Télécharger des images

on:
  workflow_dispatch:
    inputs:
      images:
        description: "nom.jpg=adresse, séparés par des espaces"
        required: true

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          mkdir -p design/images
          for paire in $IMAGES; do
            nom="${paire%%=*}"; url="${paire#*=}"
            case "$nom" in *[!A-Za-z0-9._-]*) echo "nom refusé : $nom"; exit 1;; esac
            curl -fsSL -A "Mozilla/5.0 (compatible; NovaSTEMBot/1.0)" "$url" -o "design/images/$nom"
            echo "✔ $nom ($(du -h "design/images/$nom" | cut -f1))"
          done
      - name: Enregistrer dans le repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add design/images
          git commit -m "Images libres pour les maquettes" || echo "rien de nouveau"
          git push
