# Cherche et teste des flux RSS candidats (découverte automatique des flux).
# N'appelle pas Claude : gratuit. Résultat dans agent/decouverte_sources.md.
name: Découvrir des sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decouvrir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python .github/scripts/decouvrir_sources.py agent/decouverte_sources.md agent/decouverte_sources.json
      - name: Enregistrer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent/decouverte_sources.md agent/decouverte_sources.json
          git commit -m "Découverte des sources candidates [skip ci]" && git push || echo "rien à enregistrer"
