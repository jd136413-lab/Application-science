# Réécrire les titres déjà publiés avec le « test du passant » (31/10/2026).
# L'agent relit déjà lui-même les titres de chaque nouveau passage ; ce workflow
# sert à reprendre d'un coup les fiches publiées avant. La traduction anglaise des
# titres réécrits est refaite. Coût : quelques centimes (plafond de sécurité 1 $).
# Résultat complet : agent/titres_reecrits.md (enregistré dans le repo).
# À la main : Actions → « Réécrire les titres » → Run workflow.
name: Réécrire les titres

on:
  # Claude peut aussi le lancer en poussant une branche « titres/… »
  push:
    branches: ["titres/**"]
  workflow_dispatch:

permissions:
  contents: write

# Jamais en même temps que l'agent (ils écrivent dans la même base).
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  titres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installer les dépendances
        run: pip install -r agent/requirements.txt
      - name: Relire et réécrire les titres
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Branche « titres/corriger… » : reprend les titres déjà réécrits (titres_reecrits.md)
          # Branche « titres/forcer… » : réécrit les titres listés dans agent/titres_a_forcer.txt
          MODE: ${{ contains(github.ref_name, 'forcer') && 'forcer' || (contains(github.ref_name, 'corriger') && 'corriger' || '') }}
        run: python titres.py
      - name: Enregistrer la liste des titres réécrits
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in agent/titres_reecrits.md agent/titres_corriges.md agent/titres_forces.md; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Titres réécrits (test du passant) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
