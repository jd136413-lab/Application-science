# Traduire les fiches déjà publiées (31/10/2026).
# L'agent traduit lui-même chaque nouvelle fiche (et rattrape 30 anciennes par
# passage) ; ce workflow sert à tout traduire d'un coup : au départ, ou après
# l'ajout d'une langue dans agent/traduction.py (LANGUES).
# Coût : environ 0,03 $ pour 100 fiches et par langue (Claude Haiku), avec un
# plafond de sécurité de 1 $ par exécution (PLAFOND_COUT_RATTRAPAGE).
# À la main : onglet « Actions » → « Traduire les fiches » → « Run workflow ».
name: Traduire les fiches

on:
  workflow_dispatch:
    inputs:
      maximum:
        description: "Nombre maximum de fiches à traduire"
        type: number
        default: 3000
        required: true

# Jamais en même temps que l'agent (ils écrivent dans la même base).
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  traduire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installer les dépendances
        run: pip install -r agent/requirements.txt
      - name: Traduire
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAXIMUM: ${{ inputs.maximum || 3000 }}
        run: python traduction.py
