# Compile l'application Novum à chaque modification du dossier app/ :
#  - version WEB publiée sur GitHub Pages (à ouvrir dans le navigateur)
#  - fichier APK pour Android, publié dans « Releases » (lien fixe)
# Lancement manuel possible : Actions → « Compiler l'app » → Run workflow.
name: Compiler l'app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

# Une seule compilation à la fois ; une nouvelle annule l'ancienne.
concurrency:
  group: app
  cancel-in-progress: true

permissions:
  contents: write   # publier l'APK dans Releases
  pages: write      # publier la version web
  id-token: write

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compléter le projet (dossiers Android et Web)
        run: |
          flutter --version
          flutter create --org fr.novum --project-name novum --platforms android,web .
          rm -f test/widget_test.dart
          # Réglages Android : nom affiché, accès internet, moteur graphique
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          s = s.replace('android:label="novum"', 'android:label="Novum"')
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          # Moteur « Impeller » désactivé : écrans noirs connus sur certains Xiaomi/POCO
          if "EnableImpeller" not in s:
              s = re.sub(r"(<application[^>]*>)", r'\1\n        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          # Règles pour le « nettoyeur » de code Android (R8) : ne jamais supprimer
          # le code des bibliothèques (sinon : NoSuchMethodError au démarrage).
          cat > android/app/proguard-rules.pro <<'PRO'
          -keep class io.flutter.plugins.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class dev.fluttercommunity.** { *; }
          -keep class com.llfbandit.** { *; }
          -keep class kotlin.coroutines.** { *; }
          -keep class kotlinx.coroutines.** { *; }
          -dontwarn io.flutter.embedding.**
          PRO
          # Branche le fichier de règles dans la configuration de compilation
          GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          python3 - "$GRADLE" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "proguard-rules.pro" not in s:
              kts = p.endswith(".kts")
              ligne = ('            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
                       if kts else
                       "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'")
              i = s.find("release {", s.find("buildTypes"))
              if i != -1:
                  j = s.find("\n", i)
                  s = s[:j + 1] + ligne + "\n" + s[j + 1:]
                  open(p, "w", encoding="utf-8").write(s)
          PY
          echo "::notice title=Regles R8::$(grep -c proguard-rules.pro $GRADLE) branchement(s) dans $GRADLE"
          sed -i 's#<title>novum</title>#<title>Novum</title>#' web/index.html || true
          # Diagnostic lisible dans le résumé de l'exécution
          echo "::notice title=Manifeste Android::$(grep -c 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml) permission(s) INTERNET, Impeller=$(grep -o 'EnableImpeller" android:value="[a-z]*' android/app/src/main/AndroidManifest.xml | tail -c 6)"
          echo "::notice title=Flutter::$(flutter --version | head -1)"

      - name: Installer les bibliothèques
        run: flutter pub get

      - name: Compiler la version web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Compiler l'APK Android
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          && cp build/app/outputs/flutter-apk/app-release.apk build/novum.apk

      - name: Publier l'APK (lien fixe dans Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apercu
          name: "Novum — version de test"
          body: "APK de test, recompilé automatiquement à chaque modification de l'app."
          prerelease: true
          files: app/build/novum.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  publier-web:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
