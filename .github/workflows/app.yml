# Compile l'application NovaSTEM à chaque modification du dossier app/ :
#  - version WEB publiée sur GitHub Pages (à ouvrir dans le navigateur)
#  - fichier APK pour Android, publié dans « Releases » (lien fixe)
# Lancement manuel possible : Actions → « Compiler l'app » → Run workflow.
name: Compiler l'app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      google_play:
        description: "Préparer aussi le fichier pour Google Play (.aab, tous les téléphones)"
        type: boolean
        default: false

# Une seule compilation à la fois ; une nouvelle annule l'ancienne.
concurrency:
  group: app
  cancel-in-progress: true

permissions:
  contents: write   # publier l'APK dans Releases
  pages: write      # publier la version web
  id-token: write

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Garde les téléchargements de Gradle (outils Android) d'une compilation à l'autre : plus rapide.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compléter le projet (dossiers Android et Web)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter --version
          flutter create --org fr.novum --project-name novum --platforms android,web .
          rm -f test/widget_test.dart
          # Réglages Android : nom affiché, accès internet, moteur graphique
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          s = s.replace('android:label="novum"', 'android:label="NovaSTEM"')
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          # Moteur « Impeller » désactivé : écrans noirs connus sur certains Xiaomi/POCO
          if "EnableImpeller" not in s:
              s = re.sub(r"(<application[^>]*>)", r'\1\n        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          # Règles pour le « nettoyeur » de code Android (R8) : il allège l'app mais ne doit
          # jamais supprimer le code appelé par les bibliothèques (sinon NoSuchMethodError,
          # ClassNotFoundException kotlin/Result au démarrage, vus le 19/10).
          cat > android/app/proguard-rules.pro <<'PRO'
          -keepattributes Signature,*Annotation*,InnerClasses,EnclosingMethod,Exceptions
          -keep class io.flutter.** { *; }
          -keep class dev.fluttercommunity.** { *; }
          -keep class com.llfbandit.** { *; }
          -keep class kotlin.** { *; }
          -keep class kotlin.Metadata { *; }
          -keep class kotlinx.coroutines.** { *; }
          -keep class androidx.datastore.** { *; }
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_** { *; }
          -dontwarn io.flutter.embedding.**
          -dontwarn com.google.android.play.core.**
          -dontwarn com.google.mlkit.**
          -keep class com.dexterous.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class io.flutter.plugins.firebase.** { *; }
          -keep class com.google.gson.** { *; }
          -keep class * extends com.google.gson.reflect.TypeToken
          -dontwarn com.google.firebase.**
          PRO
          # R8 en mode « compatible » (moins agressif que le mode complet).
          grep -q "android.enableR8.fullMode" android/gradle.properties || echo "android.enableR8.fullMode=false" >> android/gradle.properties
          GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          python3 - "$GRADLE" <<'PY2'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          kts = p.endswith(".kts")
          # 1) Nettoyage R8 réactivé, avec les règles ci-dessus
          if "proguard-rules.pro" not in s:
              lignes = ('            isMinifyEnabled = true\n            isShrinkResources = true\n'
                        '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")\n'
                        if kts else
                        '            minifyEnabled true\n            shrinkResources true\n'
                        "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n")
              i = s.find("release {", s.find("buildTypes"))
              j = s.find("\n", i)
              s = s[:j + 1] + lignes + s[j + 1:]
          # 1 bis) Bibliothèques natives compressées dans l'APK (téléchargement plus léger)
          if kts and "useLegacyPackaging" not in s:
              i = s.find("    buildTypes")
              s = s[:i] + "    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n\n" + s[i:]
          # 2) Clé de signature fixe, si les secrets GitHub existent (sinon clé de test)
          if kts and "novum.p12" not in s:
              bloc = ('    signingConfigs {\n'
                      '        create("novum") {\n'
                      '            val fichier = file("novum.p12")\n'
                      '            if (fichier.exists()) {\n'
                      '                storeFile = fichier\n'
                      '                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                      '                keyAlias = "novum"\n'
                      '                keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                      '            }\n'
                      '        }\n'
                      '    }\n\n')
              i = s.find("    buildTypes")
              s = s[:i] + bloc + s[i:]
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = if (file("novum.p12").exists()) signingConfigs.getByName("novum") else signingConfigs.getByName("debug")')
          open(p, "w", encoding="utf-8").write(s)
          PY2
          echo "::notice title=Nettoyage R8::$(grep -c -E 'isMinifyEnabled = true|minifyEnabled true' $GRADLE) activation(s) dans $GRADLE"
          echo "::notice title=Signature::$(grep -c 'getByName("novum")' $GRADLE) branchement(s) de la clé fixe dans $GRADLE"
          # Notifications : autorisation, petite icône, Firebase (si configuré)
          python3 ../.github/scripts/notifications_android.py
          sed -i 's#<title>novum</title>#<title>NovaSTEM</title>#' web/index.html || true
          # Diagnostic lisible dans le résumé de l'exécution
          echo "::notice title=Manifeste Android::$(grep -c 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml) permission(s) INTERNET, Impeller=$(grep -o 'EnableImpeller" android:value="[a-z]*' android/app/src/main/AndroidManifest.xml | tail -c 6)"
          echo "::notice title=Flutter::$(flutter --version | head -1)"

      - name: Installer les bibliothèques
        run: flutter pub get

      - name: Icône et écran de démarrage
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Clé de signature Android
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLE" ]; then
            echo "$CLE" | base64 -d > android/app/novum.p12
            echo "::notice title=Signature::Clé fixe NovaSTEM utilisée"
          else
            echo "::warning title=Signature::Secret ANDROID_KEYSTORE_BASE64 absent : clé de test (désinstaller avant chaque réinstallation)"
          fi

      - name: Compiler la version web
        shell: bash
        run: >
          set -o pipefail;
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          2>&1 | tee -a ../compilation.log

      - name: Pages publiques (confidentialité, contact, avancée partagée, statistiques)
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_CLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cp web_extra/*.html build/web/
          # Adresse et clé PUBLIQUE de Supabase (lecture seule) pour avancee.html et stats.html
          sed -i "s#__SUPABASE_URL__#${SB_URL}#g; s#__SUPABASE_KEY__#${SB_CLE}#g" build/web/*.html

      - name: Compiler l'APK Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          set -o pipefail;
          flutter build apk --release --target-platform android-arm64
          --build-name=1.0.0 --build-number=${{ github.run_number }}
          --dart-define=NOTIFICATIONS=$( [ "$(cat notifications.txt)" = oui ] && echo true || echo false )
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          2>&1 | tee -a ../compilation.log
          && cp build/app/outputs/flutter-apk/app-release.apk build/novum.apk

      - name: Version Android visée (exigence Google Play)
        shell: bash
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -n "$AAPT" ]; then
            echo "::notice title=Version Android::$($AAPT dump badging build/novum.apk | grep -oE "(versionCode|versionName)='[^']*'|(sdkVersion|targetSdkVersion):'[^']*'" | tr '\n' ' ')"
          fi

      - name: Fichier pour Google Play (.aab)
        if: ${{ github.event_name == 'push' || inputs.google_play }}  # à chaque modification
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          set -o pipefail;
          test -f android/app/novum.p12 || { echo "::error title=Google Play::clé de signature absente"; exit 1; };
          flutter build appbundle --release
          --build-name=1.0.0 --build-number=${{ github.run_number }}
          --dart-define=NOTIFICATIONS=$( [ "$(cat notifications.txt)" = oui ] && echo true || echo false )
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          2>&1 | tee -a ../compilation.log
          && cp build/app/outputs/bundle/release/app-release.aab build/novum-${{ github.run_number }}.aab
          && echo "::notice title=Google Play::Fichier novum-${{ github.run_number }}.aab prêt (Summary → Artifacts → novum-google-play)"

      - name: Mettre le fichier Google Play à disposition
        if: ${{ github.event_name == 'push' || inputs.google_play }}  # à chaque modification
        uses: actions/upload-artifact@v4
        with:
          name: novum-google-play
          path: app/build/novum-*.aab
          retention-days: 30

      - name: Afficher les erreurs de compilation
        if: failure()
        working-directory: .
        run: |
          grep -E "Error:|error:|Error " compilation.log | grep -v "^\s*$" | head -25 | while IFS= read -r l; do
            echo "::error title=Compilation::$l"
          done || true

      - name: Publier l'APK (lien fixe dans Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apercu
          name: "NovaSTEM — version de test"
          body: "APK de test, recompilé automatiquement à chaque modification de l'app."
          prerelease: true
          files: app/build/novum.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

      # Envoi automatique sur Google Play, canal « Tests internes » (22/10/2026).
      # Compte de service : celui de Firebase (secret FIREBASE_SERVICE_ACCOUNT),
      # autorisé dans la Play Console à « Déployer les applications sur des
      # canaux de test » seulement : jamais de publication en production.
      - name: Notes de version (Google Play)
        if: ${{ github.event_name == 'push' || inputs.google_play }}
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p build/notes
          texte=$(printf '%s' "${MESSAGE:-Mise à jour de NovaSTEM}" | head -n 1 | sed 's/\[skip ci\]//' | cut -c1-480)
          printf '%s\n' "$texte" > build/notes/whatsnew-fr-FR
      - name: Envoyer sur Google Play (tests internes)
        id: envoi_play
        if: ${{ github.event_name == 'push' || inputs.google_play }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          packageName: fr.novum.novum
          releaseFiles: app/build/novum-${{ github.run_number }}.aab
          track: internal
          status: completed
          whatsNewDirectory: app/build/notes
      - name: Résultat de l'envoi Google Play
        if: ${{ steps.envoi_play.outcome != '' && steps.envoi_play.outcome != 'skipped' }}
        run: |
          if [ "${{ steps.envoi_play.outcome }}" = "success" ]; then
            echo "::notice title=Google Play::Version ${{ github.run_number }} envoyée en tests internes (mise à jour sur le téléphone dans quelques minutes)"
          else
            echo "::error title=Google Play::Envoi refusé — voir l'étape « Envoyer sur Google Play » (autorisation pas encore active ? réessayer plus tard)"
          fi

  publier-web:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
