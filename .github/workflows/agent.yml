# Agent de collecte.
#  - AUTOMATIQUE : déclenché 2 fois par jour (8 h 20 et 18 h 20, heure de Paris)
#    par le site cron-job.org (tâche « Agent Novum » ; nom interne, peut rester), qui « appuie » sur
#    Run workflow avec un jeton GitHub limité à ce repo (permission Actions).
#    Réglages utilisés : ceux par défaut ci-dessous (5 articles, haiku, les deux fils),
#    environ 0,01 $ par passage. L'horaire intégré de GitHub (schedule) n'est pas
#    utilisé : il ne se déclenchait pas de façon fiable (19/10/2026).
#  - À LA MAIN : onglet « Actions » → « Agent de collecte » → « Run workflow ».
#
# POUR ARRÊTER LES PASSAGES AUTOMATIQUES : sur cron-job.org → Cronjobs →
#   « Agent Novum » → ÉDITER → désactiver la tâche → ENREGISTRER.
# POUR TOUT ARRÊTER (automatique ET manuel) : Actions → « Agent de collecte »
#   → « ··· » → « Disable workflow » (« Enable workflow » pour reprendre).
name: Agent de collecte

on:
  workflow_dispatch:
    inputs:
      fil:
        description: "Sources à lire (Claude décide ensuite du fil de chaque article : Sciences, Technologies ou les deux)"
        type: choice
        options: [les deux, sciences, technologies]
        default: les deux
      nombre_articles:
        description: "Nombre d'articles à ajouter (plafond de sécurité : 30)"
        type: number
        default: 5
        required: true
      modele:
        description: "Modèle Claude (haiku = très économique, sonnet = juge mieux l'importance)"
        type: choice
        options: [haiku, sonnet]
        default: haiku

# Une seule exécution à la fois : un double clic ne lance pas deux agents.
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installer les dépendances
        run: pip install -r agent/requirements.txt
      - name: Lancer l'agent
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOMBRE_ARTICLES: ${{ inputs.nombre_articles || 5 }}
          MODELE: ${{ inputs.modele || 'haiku' }}
          FIL: ${{ inputs.fil || 'les deux' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python main.py
