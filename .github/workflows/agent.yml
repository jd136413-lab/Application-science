# Agent de collecte.
#  - AUTOMATIQUE : 2 fois par jour (voir « schedule » ci-dessous), 5 articles,
#    modèle haiku, sources Sciences + Technologies (environ 0,01 $ par passage).
#  - À LA MAIN : onglet « Actions » → « Agent de collecte » → « Run workflow ».
#
# POUR TOUT ARRÊTER (automatique ET manuel) sans toucher au code :
#   Actions → « Agent de collecte » (colonne de gauche) → bouton « ··· » en haut
#   à droite → « Disable workflow ». Pour reprendre : même endroit → « Enable workflow ».
name: Agent de collecte

on:
  # Horaire automatique. Les heures sont en temps universel (UTC) :
  #   20 6,16 = 8 h 20 et 18 h 20 à Paris en été, 7 h 20 et 17 h 20 en hiver.
  # GitHub peut avoir quelques minutes (parfois plus) de retard.
  schedule:
    - cron: "20 6,16 * * *"
  workflow_dispatch:
    inputs:
      fil:
        description: "Sources à lire (Claude décide ensuite du fil de chaque article : Sciences, Technologies ou les deux)"
        type: choice
        options: [les deux, sciences, technologies]
        default: les deux
      nombre_articles:
        description: "Nombre d'articles à ajouter (plafond de sécurité : 30)"
        type: number
        default: 5
        required: true
      modele:
        description: "Modèle Claude (haiku = très économique, sonnet = juge mieux l'importance)"
        type: choice
        options: [haiku, sonnet]
        default: haiku

# Une seule exécution à la fois : un double clic ne lance pas deux agents.
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installer les dépendances
        run: pip install -r agent/requirements.txt
      - name: Lancer l'agent
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOMBRE_ARTICLES: ${{ inputs.nombre_articles || 5 }}
          MODELE: ${{ inputs.modele || 'haiku' }}
          FIL: ${{ inputs.fil || 'les deux' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python main.py
