# Agent de collecte.
#  - AUTOMATIQUE : déclenché 2 fois par jour (8 h 20 et 18 h 20, heure de Paris)
#    par le site cron-job.org (tâche « Agent Novum » ; nom interne, peut rester), qui « appuie » sur
#    Run workflow avec un jeton GitHub limité à ce repo (permission Actions).
#    Réglages utilisés : ceux par défaut ci-dessous (5 articles, haiku, les deux fils),
#    environ 0,01 $ par passage. L'horaire intégré de GitHub (schedule) n'est pas
#    utilisé : il ne se déclenchait pas de façon fiable (19/10/2026).
#  - À LA MAIN : onglet « Actions » → « Agent de collecte » → « Run workflow ».
#
# POUR ARRÊTER LES PASSAGES AUTOMATIQUES : sur cron-job.org → Cronjobs →
#   « Agent Novum » → ÉDITER → désactiver la tâche → ENREGISTRER.
# POUR TOUT ARRÊTER (automatique ET manuel) : Actions → « Agent de collecte »
#   → « ··· » → « Disable workflow » (« Enable workflow » pour reprendre).
name: Agent de collecte

on:
  workflow_dispatch:
    inputs:
      fil:
        description: "Sources à lire (Claude décide ensuite du fil de chaque article : Sciences, Technologies ou les deux)"
        type: choice
        options: [les deux, sciences, technologies]
        default: les deux
      nombre_articles:
        description: "Nombre d'articles à ajouter (plafond de sécurité : 30)"
        type: number
        default: 5
        required: true
      modele:
        description: "Modèle Claude (haiku = très économique, sonnet = juge mieux l'importance)"
        type: choice
        options: [haiku, sonnet]
        default: haiku
      controle_semaine:
        description: "Faire aussi le contrôle de la semaine (grands sujets ratés ?) — automatique le dimanche soir"
        type: boolean
        default: false

permissions:
  contents: write   # enregistrer agent/bilan_sources.md
  actions: write    # lancer la « Vidéo de la semaine » le samedi soir

# Une seule exécution à la fois : un double clic ne lance pas deux agents.
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 160 sources à lire + attente du traitement par lot (15 min max)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # pour savoir si le bilan des sources a déjà été enregistré aujourd'hui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installer les dépendances
        run: pip install -r agent/requirements.txt
      # Mémoire de la présélection : les articles déjà triés ne sont pas retriés (économie).
      - name: Mémoire de la présélection
        uses: actions/cache@v4
        with:
          path: agent/memoire_tri.json
          key: memoire-tri-v3-${{ github.run_id }}
          restore-keys: memoire-tri-v3-
      # Mémoire du bilan des sources (ce que chaque source apporte, 30 jours).
      - name: Mémoire du bilan des sources
        uses: actions/cache@v4
        with:
          path: agent/stats_sources.json
          key: stats-sources-v1-${{ github.run_id }}
          restore-keys: stats-sources-v1-
      - name: Lancer l'agent
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOMBRE_ARTICLES: ${{ inputs.nombre_articles || 5 }}
          MODELE: ${{ inputs.modele || 'haiku' }}
          FIL: ${{ inputs.fil || 'les deux' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python main.py
      # Bilan des sources (agent/bilan_sources.md) enregistré dans le repo une fois par jour
      # (premier passage de la journée) : lisible par Claude et par Maxime.
      - name: Enregistrer le bilan des sources
        if: always()
        run: |
          if [ ! -f agent/bilan_sources.md ]; then echo "Pas de bilan."; exit 0; fi
          # Une fois par jour : au premier passage de la journée (celui du matin).
          if git ls-files --error-unmatch agent/bilan_sources.md >/dev/null 2>&1 && [ "$(TZ=Europe/Paris git log -1 --format=%cd --date=format-local:%Y-%m-%d -- agent/bilan_sources.md)" = "$(TZ=Europe/Paris date +%Y-%m-%d)" ]; then
            echo "Bilan déjà enregistré aujourd'hui."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent/bilan_sources.md
          git commit -m "Bilan des sources [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      # Contrôle hebdomadaire : le dimanche soir (passage de 18 h 20), ou à la main.
      - name: Contrôle de la semaine
        if: always()
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          A_LA_MAIN: ${{ inputs.controle_semaine }}
        run: |
          JOUR=$(TZ=Europe/Paris date +%u); HEURE=$(TZ=Europe/Paris date +%H)
          if [ "$A_LA_MAIN" = "true" ] || { [ "$JOUR" = "7" ] && [ "$HEURE" -ge 15 ]; }; then
            python controle_semaine.py
          else
            echo "Pas de contrôle aujourd'hui (seulement le dimanche soir ou à la main)."
          fi
      # Vidéo de la semaine : lancée le samedi soir (passage de 18 h 20).
      - name: Lancer la vidéo de la semaine (samedi soir)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOUR=$(TZ=Europe/Paris date +%u); HEURE=$(TZ=Europe/Paris date +%H)
          if [ "$JOUR" = "6" ] && [ "$HEURE" -ge 15 ]; then
            gh workflow run video.yml --ref main -f enregistrer=true -R "$GITHUB_REPOSITORY" && echo "Vidéo de la semaine lancée."
          else
            echo "Pas de vidéo aujourd'hui (seulement le samedi soir)."
          fi
