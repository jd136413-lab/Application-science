# Essai Haiku / Sonnet / Haiku + accroche (18/11/2026) — à la main seulement. RIEN n'est publié.
# 5 fiches récentes rédigées 3 fois à partir de la même base ; résultat dans le journal. ≈ 0,35 $.
name: Essai des modèles (Haiku / Sonnet)

on:
  workflow_dispatch:

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Lancer l'essai
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python essai_modeles.py
